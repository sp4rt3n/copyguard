services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: copyguard
      POSTGRES_USER: copyguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copyguard2024}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copyguard -d copyguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  copyguard:
    build: .
    expose:
      - "8000"
    volumes:
      - copyguard_uploads:/app/data/uploads
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql://copyguard:${POSTGRES_PASSWORD:-copyguard2024}@db:5432/copyguard
      - UPLOAD_DIR=/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - copyguard
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  pg_data:
  copyguard_uploads:
