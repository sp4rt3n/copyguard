services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: copyguard
      POSTGRES_USER: copyguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"        # exposed for local DB tools (e.g. DBeaver)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copyguard -d copyguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  copyguard:
    build: .
    expose:
      - "8000"
    volumes:
      - copyguard_uploads:/app/data/uploads
      - ./backend:/app/backend   # hot-reload: code changes reflect immediately
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql://copyguard:${POSTGRES_PASSWORD}@db:5432/copyguard
      - UPLOAD_DIR=/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - copyguard
    restart: unless-stopped

volumes:
  pg_data:
  copyguard_uploads:
