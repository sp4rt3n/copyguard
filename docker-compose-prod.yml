services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: copyguard
      POSTGRES_USER: copyguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # no port exposure — only reachable inside Docker network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copyguard -d copyguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  copyguard:
    build: .
    expose:
      - "8000"
    volumes:
      - copyguard_uploads:/app/data/uploads
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql://copyguard:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/copyguard
      - UPLOAD_DIR=/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - copyguard
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Cloudflare Tunnel — set CLOUDFLARE_TUNNEL_TOKEN in backend/.env to enable
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      - nginx
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  pg_data:
  copyguard_uploads:
